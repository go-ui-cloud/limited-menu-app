<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>期間限定グルメ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17191d;font-family:Arial,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}main{max-width:1220px;margin:auto;padding:46px 28px 60px}header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:34px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;color:#e45a2b;margin-bottom:10px}h1{font-size:42px;letter-spacing:-.04em;margin:0 0 8px}header p{margin:0;color:#676c75}.actions{display:flex;gap:10px;white-space:nowrap}button,select,input{font:inherit}.primary,.secondary{border:0;border-radius:12px;padding:13px 17px;font-weight:800;cursor:pointer}.primary{background:#17191d;color:white}.secondary{background:white;border:1px solid #dcdfe4}.toolbar{display:flex;justify-content:space-between;gap:12px;background:white;border:1px solid #e1e4e8;border-radius:16px;padding:12px;margin-bottom:12px}.filters{display:flex;gap:10px}.toolbar select{border:1px solid #dfe2e6;background:#fafafa;border-radius:10px;padding:10px 34px 10px 12px}.meta{display:flex;gap:8px;color:#777c85;font-size:13px;margin:12px 2px 20px}.meta span{margin-left:auto}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid #e2e4e7;border-radius:18px;overflow:hidden;box-shadow:0 3px 18px rgba(0,0,0,.035)}.image{height:220px;background:#eceff2;position:relative;overflow:hidden}.image img{width:100%;height:100%;object-fit:cover}.ph{height:100%;display:grid;place-items:center;font-weight:900;color:#b1b5bb;letter-spacing:.1em}.store{position:absolute;left:12px;top:12px;background:rgba(20,20,22,.85);color:white;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.body{padding:18px}.cat{font-size:11px;font-weight:800;color:#e45a2b;margin-bottom:7px}.body h2{font-size:19px;line-height:1.4;margin:0;min-height:54px}.price{font-size:20px;font-weight:900;margin:12px 0 14px}dl{margin:0;background:#f7f8fa;border-radius:12px;padding:11px 12px}dl div{display:flex;justify-content:space-between;gap:14px;padding:5px 0;font-size:12px}dt{color:#888d95}dd{margin:0;text-align:right;font-weight:700}.body a{display:inline-block;margin-top:14px;color:#17191d;font-weight:800;font-size:13px;text-decoration:none}.empty{background:white;border:1px dashed #cfd3d9;border-radius:18px;padding:72px 30px;text-align:center;color:#6f747c;line-height:1.8}footer{text-align:center;color:#8a8f97;font-size:11px;margin-top:36px}.modalBack{position:fixed;inset:0;background:rgba(12,14,18,.45);display:none;place-items:center;padding:20px;z-index:20}.modalBack.open{display:grid}.modal{width:min(440px,100%);background:white;border-radius:18px;padding:25px;position:relative}.modal h3{font-size:22px;margin:0 0 8px}.modal p{font-size:13px;color:#777;margin-bottom:20px}.modal label{display:block;font-size:12px;font-weight:800;margin:14px 0}.modal input,.modal select{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #d8dce2;border-radius:10px;background:white}.full{width:100%;margin-top:8px}.x{position:absolute;right:15px;top:12px;border:0;background:transparent;font-size:26px;cursor:pointer}.notice{background:#fff7e8;border:1px solid #f0d7a7;color:#765522;padding:11px 13px;border-radius:12px;font-size:12px;margin-bottom:16px;display:none}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.toolbar{align-items:stretch;flex-direction:column}.filters{width:100%}.filters select{flex:1}}@media(max-width:620px){main{padding:30px 16px}h1{font-size:34px}.grid{grid-template-columns:1fr}.actions,.filters{flex-direction:column}.image{height:240px}}
</style></head><body><main>
<header><div><div class="eyebrow">LIMITED MENU FINDER</div><h1>期間限定グルメ</h1><p>人気チェーンの期間限定商品を、販売開始日・価格・販売期間でまとめてチェック。</p></div><div class="actions"><button class="secondary" id="addBtn">＋ 店舗を追加</button><button class="primary" id="refreshBtn">↻ 最新情報に更新</button></div></header>
<div class="notice" id="notice"></div>
<section class="toolbar"><div class="filters"><select id="cat"></select><select id="store"></select></div><select id="order"><option value="desc">販売開始日：新しい順</option><option value="asc">販売開始日：古い順</option></select></section>
<div class="meta"><b id="count">0</b> 件を表示 <span id="updated">最終更新: —</span></div><section class="grid" id="grid"></section>
<footer>価格・販売期間は店舗や地域で異なる場合があります。確認できない情報は推測せず「不明」と表示します。</footer>
<div class="modalBack" id="modal"><div class="modal"><button class="x" id="closeBtn">×</button><h3>店舗を追加</h3><p>店舗名・カテゴリ・公式サイトのドメインを登録すると、更新時の検索対象に加わります。</p><label>店舗名<input id="newName" placeholder="例：コメダ珈琲店"></label><label>カテゴリ<select id="newCat"></select></label><label>公式サイトのドメイン<input id="newDomain" placeholder="例：komeda.co.jp"></label><button class="primary full" id="saveBtn">追加する</button></div></div>
<script>
const base=[['バーガー','マクドナルド','mcdonalds.co.jp'],['バーガー','ケンタッキー','kfc.co.jp'],['バーガー','モス','mos.jp'],['バーガー','バーガーキング','burgerking.co.jp'],['スイーツ・カフェ','ミスド','misterdonut.jp'],['寿司','スシロー','akindo-sushiro.co.jp'],['寿司','はま寿司','hama-sushi.co.jp'],['寿司','くら寿司','kurasushi.co.jp'],['丼・定食','松屋','matsuyafoods.co.jp'],['丼・定食','松のや','matsuyafoods.co.jp'],['丼・定食','かつや','arclandservice.co.jp/katsuya'],['ピザ','ドミノピザ','dominos.jp'],['ピザ','ピザハット','pizzahut.jp'],['ピザ','ピザーラ','pizza-la.co.jp'],['スイーツ・カフェ','スターバックス','starbucks.co.jp'],['カレー','ココイチ','ichibanya.co.jp'],['麺','丸亀製麺','marugame.com'],['スイーツ・カフェ','31アイス','31ice.co.jp'],['弁当','ほっともっと','hottomotto.com'],['丼・定食','すき家','sukiya.jp'],['丼・定食','吉野家','yoshinoya.com']];
let products=[],extra=JSON.parse(localStorage.getItem('extraStores')||'[]');const $=id=>document.getElementById(id);const modal=$('modal');
function stores(){return [...base,...extra]} function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(d){if(!d)return'不明';const x=new Date(d);return isNaN(x)?esc(d):x.toLocaleDateString('ja-JP')} function period(p){return p.startDate?`${fmt(p.startDate)} 〜 ${p.endDate?fmt(p.endDate):'終了日未定'}`:'不明'}
function options(){const cs=['すべて',...new Set(stores().map(x=>x[0]))];$('cat').innerHTML=cs.map(x=>`<option>${esc(x)}</option>`).join('');$('newCat').innerHTML=[...cs.filter(x=>x!='すべて'),'その他'].filter((x,i,a)=>a.indexOf(x)==i).map(x=>`<option>${esc(x)}</option>`).join('');storeOptions()}
function storeOptions(){const c=$('cat').value||'すべて',ss=stores().filter(x=>c==='すべて'||x[0]===c);$('store').innerHTML='<option>すべて</option>'+ss.map(x=>`<option>${esc(x[1])}</option>`).join('')}
function render(){const c=$('cat').value,s=$('store').value,o=$('order').value;const rows=products.filter(p=>(c==='すべて'||p.category===c)&&(s==='すべて'||p.store===s)).sort((a,b)=>(o==='desc'?-1:1)*(new Date(a.startDate||0)-new Date(b.startDate||0)));$('count').textContent=rows.length;if(!rows.length){$('grid').innerHTML='<div class="empty" style="grid-column:1/-1">現在、条件に一致する確認済み商品はありません。<br><small>「最新情報に更新」で各社の公式情報を再確認します。</small></div>';return}$('grid').innerHTML=rows.map(p=>`<article class="card"><div class="image">${p.image?`<img src="${esc(p.image)}" alt="" onerror="this.outerHTML='<div class=ph>NO IMAGE</div>'">`:'<div class="ph">NO IMAGE</div>'}<span class="store">${esc(p.store)}</span></div><div class="body"><div class="cat">${esc(p.category)}</div><h2>${esc(p.title)}</h2><div class="price">${esc(p.price||'価格不明')}</div><dl><div><dt>販売開始日</dt><dd>${fmt(p.startDate)}</dd></div><div><dt>販売終了日</dt><dd>${fmt(p.endDate)}</dd></div><div><dt>販売期間</dt><dd>${period(p)}</dd></div></dl><a href="${esc(p.url)}" target="_blank" rel="noreferrer">公式情報を見る ↗</a></div></article>`).join('')}
async function load(){const b=$('refreshBtn');b.disabled=true;b.textContent='更新中…';$('notice').style.display='none';try{const r=await fetch('/api/products',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({extraStores:extra})});const j=await r.json();products=j.products||[];$('updated').textContent='最終更新: '+new Date(j.updatedAt).toLocaleString('ja-JP');if(j.warning){$('notice').textContent=j.warning;$('notice').style.display='block'}render()}catch(e){$('notice').textContent='最新情報の取得に失敗しました。時間を置いて再度更新してください。';$('notice').style.display='block'}finally{b.disabled=false;b.textContent='↻ 最新情報に更新'}}
$('addBtn').onclick=()=>modal.classList.add('open');$('closeBtn').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};$('saveBtn').onclick=()=>{const n=$('newName').value.trim(),c=$('newCat').value,d=$('newDomain').value.trim().replace(/^https?:\/\//,'').replace(/\/$/,'');if(!n||!d)return alert('店舗名と公式サイトのドメインを入力してください');if(!stores().some(x=>x[1]===n)){extra.push([c,n,d]);localStorage.setItem('extraStores',JSON.stringify(extra));options()}$('newName').value='';$('newDomain').value='';modal.classList.remove('open');load()};$('cat').onchange=()=>{storeOptions();render()};$('store').onchange=render;$('order').onchange=render;$('refreshBtn').onclick=load;options();load();
</script></main></body></html>
